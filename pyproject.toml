[project]
name = "notes2tone"
version = "0.1.0"
description = "OMR benchmarking framework"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0,<2.0",
    "opencv-python>=4.8.0",
    "datasets>=2.14.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "music21>=8.3.0,<10.0.0",
    "oemer>=0.1.8",
    "onnxruntime-gpu==1.19.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["benchmarks", "musicdiff"]
