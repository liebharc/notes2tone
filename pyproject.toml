[project]
name = "notes2tone"
version = "0.1.0"
description = "OMR benchmarking framework"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0,<2.0",
    "opencv-python>=4.8.0",
    "datasets>=2.14.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "music21>=8.3.0,<10.0.0",
    "oemer>=0.1.8",
    "ruff>=0.1.0",
]

[project.optional-dependencies]
# CUDA 11.x
gpu-cuda11 = ["onnxruntime-gpu==1.15.1"]

# CUDA 12.x
gpu-cuda12 = ["onnxruntime-gpu>=1.19.0"]

# CPU only
cpu = ["onnxruntime>=1.15.1"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
